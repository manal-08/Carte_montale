<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cartes maths</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PDF.js & JSZip for extracting text from PDF and PPTX lesson files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Cairo Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-app: #f1f5f9;
      --text-main: #0f172a;
      --card-1-bg: #fffbeb;
      --card-1-hd: #fde68a;
      --card-1-tx: #92400e;
      --card-2-bg: #ecfdf5;
      --card-2-hd: #a7f3d0;
      --card-2-tx: #065f46;
      --card-3-bg: #eff6ff;
      --card-3-hd: #bfdbfe;
      --card-3-tx: #1e3a8a;
      --card-4-bg: #f8fafc;
      --card-4-hd: #e2e8f0;
      --card-4-tx: #1e293b;
      --card-5-bg: #fff1f2;
      --card-5-hd: #fecdd3;
      --card-5-tx: #9f1239;
      --card-6-bg: #f5f3ff;
      --card-6-hd: #ddd6fe;
      --card-6-tx: #5b21b6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .auth-canvas {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 14%, rgba(251, 146, 60, 0.16), transparent 36%),
        radial-gradient(circle at 88% 18%, rgba(249, 115, 22, 0.12), transparent 38%),
        radial-gradient(circle at 50% 90%, rgba(253, 186, 116, 0.16), transparent 42%),
        #fff7ed;
    }

    .btn-grad-primary {
      background: linear-gradient(90deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(234, 88, 12, 0.28);
    }

    .btn-grad-primary:hover {
      filter: brightness(1.05);
    }

    .topbar {
      background: #0f172a;
      color: #ffffff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.22);
    }

    .status-strip {
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 16px;
      border-top: 1px solid #334155;
    }

    .sheet-scroll {
      padding: 14px;
      overflow-x: auto;
    }

    .mindmap-page {
      background: #ffffff;
      width: 1120px;
      min-width: 1120px;
      min-height: 780px;
      margin: 0 auto;
      padding: 18px 22px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      border: 1.5px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transform-origin: top center;
    }

    .top-header {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 12px;
      align-items: start;
    }

    .header-box {
      border: 1.5px solid #94a3b8;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.7;
      background: #f8fafc;
    }

    .header-box div span[contenteditable="true"] {
      display: inline-block;
      min-width: 75px;
      border-bottom: 1px dotted #64748b;
      font-weight: 700;
      color: #0f172a;
      padding: 0 4px;
    }

    .header-center {
      text-align: center;
      padding-top: 4px;
    }

    .header-center h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      color: #065f46;
    }

    .header-center .sub-meta {
      margin-top: 4px;
      font-size: 13.5px;
      font-weight: 700;
      color: #047857;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      align-items: stretch;
      flex: 1;
    }

    .col-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: space-between;
    }

    .card {
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
      transition: min-height 0.16s ease, flex-grow 0.16s ease;
    }

    .card-title {
      padding: 6px 12px;
      font-weight: 800;
      font-size: 13.5px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .card-title-label {
      flex: 1;
      text-align: center;
    }

    .card-resize-controls {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      opacity: 0.72;
      transition: opacity 0.15s ease;
      flex-shrink: 0;
    }

    .card:hover .card-resize-controls,
    .card-resize-controls:focus-within {
      opacity: 1;
    }

    .card-resize-btn {
      width: 20px;
      height: 20px;
      line-height: 18px;
      text-align: center;
      border-radius: 6px;
      border: 1px solid rgba(15, 23, 42, 0.22);
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      padding: 0;
      user-select: none;
    }

    .card-resize-btn:hover {
      background: #ffffff;
      border-color: rgba(15, 23, 42, 0.45);
    }

    .card-body {
      padding: 10px 12px;
      font-size: 11.7px;
      line-height: 1.62;
      flex: 1;
    }

    .card-body ul {
      margin: 0;
      padding-right: 16px;
    }

    .card-body li {
      margin-bottom: 5px;
    }

    .c1 { background: var(--card-1-bg); border-color: #fcd34d; }
    .c1 .card-title { background: var(--card-1-hd); color: var(--card-1-tx); }

    .c2 { background: var(--card-2-bg); border-color: #6ee7b7; }
    .c2 .card-title { background: var(--card-2-hd); color: var(--card-2-tx); }

    .c3 { background: var(--card-3-bg); border-color: #93c5fd; }
    .c3 .card-title { background: var(--card-3-hd); color: var(--card-3-tx); }

    .c4 { background: var(--card-4-bg); border-color: #cbd5e1; }
    .c4 .card-title { background: var(--card-4-hd); color: var(--card-4-tx); }

    .c5 { background: var(--card-5-bg); border-color: #fda4af; }
    .c5 .card-title { background: var(--card-5-hd); color: var(--card-5-tx); }

    .c6 { background: var(--card-6-bg); border-color: #c4b5fd; }
    .c6 .card-title { background: var(--card-6-hd); color: var(--card-6-tx); }

    .center-hub {
      border: 2px solid #047857;
      border-radius: 14px;
      background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 100%);
      padding: 10px 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(4, 120, 87, 0.12);
    }

    .center-hub .lvl-tag {
      font-size: 12px;
      font-weight: 800;
      color: #047857;
    }

    .center-hub .week-big {
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
      margin: 2px 0;
    }

    .center-hub .lesson-line {
      font-size: 11.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .center-hub .session-pill {
      display: inline-block;
      border: 1.5px solid #047857;
      background: #d1fae5;
      color: #064e3b;
      font-weight: 800;
      font-size: 12px;
      padding: 2px 16px;
      border-radius: 999px;
    }

    .week-bar {
      border: 1.5px solid #94a3b8;
      border-radius: 14px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #f8fafc;
      font-size: 11.5px;
    }

    .week-bar-title {
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      padding-left: 6px;
      display: flex;
      align-items: center;
    }

    .session-chip {
      flex: 1;
      text-align: center;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.35;
      transition: all 0.15s ease;
      user-select: none;
    }

    .session-chip:hover {
      border-color: #059669;
      background: #f0fdf4;
    }

    .session-chip.active {
      background: #047857;
      color: #ffffff;
      border-color: #064e3b;
      font-weight: 800;
    }

    [contenteditable="true"]:focus {
      outline: 2px solid #2563eb;
      background: rgba(37, 99, 235, 0.06);
      border-radius: 4px;
    }

    .drag-over {
      border-color: #059669 !important;
      background-color: #ecfdf5 !important;
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 4mm;
      }

      html, body {
        width: 100%;
        height: auto;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        overflow: hidden !important;
      }

      .topbar,
      .status-strip,
      .card-resize-controls {
        display: none !important;
      }

      #resultView {
        min-height: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        background: #ffffff !important;
      }

      .sheet-scroll {
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
      }

      .mindmap-page {
        width: 1120px !important;
        min-width: 1120px !important;
        min-height: 0 !important;
        height: auto !important;
        margin: 0 auto !important;
        padding: 12px 16px !important;
        box-shadow: none !important;
        border: 1px solid #94a3b8 !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        transform: scale(var(--print-scale, 0.94));
        transform-origin: top center;
      }

      .col-stack,
      .card,
      .main-grid,
      .top-header,
      .week-bar {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>
  <!-- 1. MATHEMATICS UPLOAD SCREEN (cartes maths) -->
  <section id="uploadMathView" class="min-h-screen auth-canvas px-4 pt-6 pb-8 sm:px-8 flex flex-col justify-start items-center">
    <div class="max-w-xl w-full mx-auto space-y-6">
      <!-- Top Navigation Bar -->
      <div class="flex items-center justify-between gap-2">
        <button
          type="button"
          data-action="go-index"
          class="px-5 py-2.5 rounded-2xl bg-white hover:bg-orange-50 text-orange-500 text-xs sm:text-sm font-extrabold border border-orange-200 shadow-sm cursor-pointer transition flex items-center gap-1.5"
        >
          <span>🏠</span>
          <span>Accueil / الرئيسية</span>
        </button>

        <span
          id="accountBadgeText"
          class="px-4 py-2 rounded-2xl bg-white text-orange-500 text-xs font-extrabold border border-orange-200 shadow-sm"
        >
          cartes maths
        </span>
      </div>

      <!-- Page Header -->
      <div class="text-center space-y-1">
        <h1 class="text-3xl sm:text-4xl font-black text-orange-500 tracking-tight">cartes maths</h1>
        <h2 class="text-xl sm:text-2xl font-black text-orange-500">Mathématiques الرياضيات</h2>
      </div>

      <!-- Drag & Drop / File Picker Zone -->
      <label
        for="fileInputMath"
        data-drop-zone="math"
        class="block w-full rounded-3xl border-2 border-dashed border-orange-400 hover:border-orange-500 bg-white/95 p-10 sm:p-14 text-center shadow-sm cursor-pointer transition space-y-3"
      >
        <div class="text-5xl text-orange-500 font-black">⬆</div>
        <div class="text-xl sm:text-2xl font-black text-orange-500">رفع ملف PPTX</div>
        <div class="text-xs font-bold text-orange-500">.pptx, .pdf, .txt, .md</div>
        <div class="upload-status-text text-sm font-extrabold text-orange-500 min-h-[22px]"></div>
      </label>
      <input type="file" id="fileInputMath" accept=".pptx,.pdf,.txt,.md" class="hidden" />

      <!-- Generate Button -->
      <button
        type="button"
        data-generate-subject="math"
        class="w-full py-4 px-6 rounded-2xl text-base sm:text-lg font-black btn-grad-primary text-white cursor-pointer transition"
      >
        إنشاء خريطة ذهنية
      </button>
    </div>
  </section>

  <!-- 2. DEDICATED MIND MAP RESULT VIEW -->
  <section id="resultView" class="hidden min-h-screen bg-slate-100 pb-10">
    <header class="topbar">
      <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2.5">
        <div class="flex items-center gap-2">
          <button
            type="button"
            id="resultBackUploadBtn"
            class="px-4 py-2 rounded-lg text-xs sm:text-sm font-extrabold bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white cursor-pointer transition"
          >
            رجوع
          </button>
          <button
            type="button"
            data-action="go-index"
            class="px-4 py-2 rounded-lg text-xs sm:text-sm font-extrabold bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white cursor-pointer transition"
          >
            Accueil / الرئيسية
          </button>
          <span class="hidden sm:inline-block text-sm font-black text-amber-400 tracking-tight px-2">
            cartes maths
          </span>
        </div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            id="printMindmapBtn"
            class="px-4 py-2 rounded-lg text-xs sm:text-sm font-extrabold bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white cursor-pointer transition"
          >
            طباعة
          </button>
          <button
            type="button"
            id="downloadMindmapBtn"
            class="px-5 py-2 rounded-lg text-xs sm:text-sm font-extrabold bg-amber-400 hover:bg-amber-300 text-amber-950 cursor-pointer transition"
          >
            تنزيل
          </button>
        </div>
      </div>
    </header>

    <div class="status-strip">
      <div id="resultStatusText" class="max-w-6xl mx-auto"></div>
    </div>

    <main class="sheet-scroll">
      <div id="resultContainer"></div>
    </main>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,

    (function () {

      }

      var FIREBASE_CONFIG = {

        authDomain: "catre-montale.firebaseapp.com",
        projectId: "catre-montale",
        storageBucket: "catre-montale.firebasestorage.app",

        "اقرأ نص الدرس المرفق واستخرج المعلومات المرتبطة بالحصة المحددة من 1 إلى 5 (S1 الحصة الأولى، S2 الحصة الثانية، S3 الحصة الثالثة، S4 الحصة الرابعة، S5 الحصة الخامسة) بدقة.",
        "في الشريط السفلي (برمجة الأسبوع) الخاص بالرياضيات: استخرج الدروس المرقمة من 1 إلى 5 من الأصغر إلى الأكبر الموجودة غالبًا في الشريحة أو الصفحة رقم 4 حيث يظهر عنوان «برمجة الأسبوع» / «برمجة اسبوع» مع عناوين الدروس (أو في الصفحة/الشريحة 5 كاحتياطي)، بحيث يمثل السطر الأول (l1) في كل حصة عنوان درس المستوى الأول ويمثل السطر الثاني (l2) عنوان درس المستوى الثاني كما وردا حرفيًا.",
        "في حقل today_announcement اكتب عنوان درس المستوى الأول وعنوان درس المستوى الثاني مفصولين بـ | بدون تكرار اسم المستوى أو أرقام شرائح زائدة.",

      ].join("\n");

      var SAMPLE_SEM4_CONTENT = [
        "[شريحة 1] الرياضيات - المستويان 5 و 6 - SEM4 - S1",
        "[شريحة 4] برمجة الأسبوع - SEM4",
        "1 - قياس الأطوال والكتل والمساحات | مقارنة وترتيب الأعداد العشرية",
        "2 - تحويل وحدات القياس | جمع وطرح الأعداد العشرية",
        "3 - حل مسائل في القياس | ضرب الأعداد العشرية",
        "4 - أنشطة داعمة في القياس | قسمة عدد عشري على عدد صحيح",
        "5 - تقويم ودعم الأسبوع الرابع | تقويم ودعم الأسبوع الرابع"
      ].join("\n");

      var db = null;
      var firestoreReady = false;
      var activeSessionNum = "1";
      var extractedLessonContent = "";
      var extractedFileName = "";
      var lastAiResponseObj = null;
      var cachedSharedKey = "";
      var detectedLevels = { firstNum: "5", secondNum: "6", pairLabel: "المستويان 5 و 6" };

      // Stores custom height offsets (in px) per card key: "c1" .. "c6"
      var cardHeightOffsets = {
        c1: 0,
        c2: 0,
        c3: 0,
        c4: 0,
        c5: 0,
        c6: 0
      };

      var ALL_VIEWS = [
        "uploadMathView",
        "resultView"
      ];

      function initFirebase() {
        try {
          var app = initializeApp(FIREBASE_CONFIG);
          db = getFirestore(app);
          firestoreReady = true;
        } catch (e) {
          firestoreReady = false;
        }
      }

      function showView(viewId) {
        for (var i = 0; i < ALL_VIEWS.length; i++) {
          var id = ALL_VIEWS[i];
          var el = document.getElementById(id);
          if (!el) continue;
          if (id === viewId) {
            el.classList.remove("hidden");
            el.style.display = id === "uploadMathView" ? "flex" : "block";
          } else {
            el.classList.add("hidden");
            el.style.display = "none";
          }
        }
        window.scrollTo(0, 0);
      }

        var els = document.querySelectorAll(".upload-status-text");
        for (var i = 0; i < els.length; i++) {
          els[i].textContent = msg || "";
        }
      }

      function setResultStatus(msg) {
        var el = document.getElementById("resultStatusText");
        if (!el) return;
        el.textContent =
          msg ||
          "S" +
            activeSessionNum +
            " (" +
            getSessionOrdinalArabic(activeSessionNum) +
            ") - يمكنك تعديل أي خانة مباشرة أو تعديل طول كل بطاقة (+ / -) ثم الضغط على «تنزيل» أو «طباعة».";

        if (!badgeEl) return;

      function withTimeout(promise, ms) {
        return new Promise(function (resolve) {
          var settled = false;
          var timer = setTimeout(function () {
            if (!settled) {

              resolve(null);
            }
          }, ms || 1200);

          Promise.resolve(promise)
            .then(function (val) {
              if (!settled) {
                settled = true;
                clearTimeout(timer);
                resolve(val);
              }
            })
            .catch(function () {
              if (!settled) {
                settled = true;
                clearTimeout(timer);
                resolve(null);
              }
            });
        });
      }

      function readFileAsArrayBufferSafe(file) {
        return new Promise(function (resolve, reject) {
          try {
            if (file && typeof file.arrayBuffer === "function") {
              file
                .arrayBuffer()
                .then(resolve)
                .catch(function () {
                  readViaFileReader(file, "arrayBuffer").then(resolve).catch(reject);
                });
              return;
            }
            readViaFileReader(file, "arrayBuffer").then(resolve).catch(reject);
          } catch (e) {
            reject(e);
          }
        });
      }

      function readFileAsTextSafe(file) {
        return new Promise(function (resolve, reject) {
          try {
            if (file && typeof file.text === "function") {
              file
                .text()
                .then(resolve)
                .catch(function () {
                  readViaFileReader(file, "text").then(resolve).catch(reject);
                });
              return;
            }
            readViaFileReader(file, "text").then(resolve).catch(reject);
          } catch (e) {
            reject(e);
          }
        });
      }

      function readViaFileReader(file, mode) {
        return new Promise(function (resolve, reject) {
          try {
            if (typeof FileReader === "undefined") {
              reject(new Error("NO_FILEREADER"));
              return;
            }
            var reader = new FileReader();
            reader.onload = function () {
              resolve(reader.result);
            };
            reader.onerror = function () {
              reject(reader.error || new Error("FILEREADER_ERROR"));
            };
            reader.onabort = function () {
              reject(new Error("FILEREADER_ABORT"));
            };
            if (mode === "arrayBuffer") {
              reader.readAsArrayBuffer(file);
            } else {
              reader.readAsText(file, "UTF-8");
            }
          } catch (e) {
            reject(e);
          }
        });
      }

      function buildFilenameFallbackText(fileName) {

      function readPdfFile(file) {
        return new Promise(function (resolve, reject) {
          try {
            if (!window.pdfjsLib || typeof window.pdfjsLib.getDocument !== "function") {
              reject(new Error("PDF"));
              return;
            }
            readFileAsArrayBufferSafe(file)
              .then(function (buf) {
                return window.pdfjsLib.getDocument({ data: buf }).promise;
              })
              .then(function (pdf) {
                var pages = [];
                function step(p) {
                  if (p > pdf.numPages) {
                    resolve(pages.join("\n\n"));
                    return;
                  }
                  pdf
                    .getPage(p)
                    .then(function (pg) {
                      return pg.getTextContent();
                    })
                    .then(function (cnt) {
                      var items = cnt && Array.isArray(cnt.items) ? cnt.items : [];
                      pages.push(
                        "[صفحة " +
                          p +
                          "] " +
                          items
                            .map(function (it) {
                              return it && it.str ? it.str : "";
                            })
                            .join(" ")
                      );
                      step(p + 1);
                    })
                    .catch(function () {
                      step(p + 1);
                    });
                }
                step(1);
              })
              .catch(reject);
          } catch (e) {
            reject(e);
          }
        });
      }

      function readPptxFile(file) {
        return new Promise(function (resolve, reject) {
          try {
            if (!window.JSZip || typeof window.JSZip.loadAsync !== "function") {
              reject(new Error("PPTX"));
              return;
            }
            readFileAsArrayBufferSafe(file)
              .then(function (buf) {
                return window.JSZip.loadAsync(buf);
              })
              .then(function (zip) {
                var slideNames = Object.keys(zip.files || {})
                  .filter(function (n) {
                    return /^ppt\/slides\/slide\d+\.xml$/.test(n);
                  })
                  .sort(function (a, b) {
                    return parseInt(a.match(/\d+/)[0], 10) - parseInt(b.match(/\d+/)[0], 10);
                  });
                var slides = [];
                function step(idx) {
                  if (idx >= slideNames.length) {
                    resolve(slides.join("\n\n"));
                    return;
                  }
                  zip.files[slideNames[idx]]
                    .async("string")
                    .then(function (xml) {
                      var docXml = new DOMParser().parseFromString(xml, "text/xml");
                      var paras = docXml.getElementsByTagName("a:p");
                      var parts = [];
                      for (var i = 0; i < paras.length; i++) {
                        var ts = paras[i].getElementsByTagName("a:t");
                        var line = "";
                        for (var j = 0; j < ts.length; j++) {
                          line += ts[j].textContent || "";
                        }
                        if (line.trim()) parts.push(line.trim());
                      }
                      slides.push("[شريحة " + (idx + 1) + "] " + parts.join("\n"));
                      step(idx + 1);
                    })
                    .catch(function () {
                      step(idx + 1);
                    });
                }
                step(0);
              })
              .catch(reject);
          } catch (e) {
            reject(e);
          }
        });
      }

      function toLatinDigit(tok) {
        var ar = "٠١٢٣٤٥٦٧٨٩";

      function mapWeekNumberToArabicLabel(numStr) {
        var map = {
          "1": "الأسبوع الأول",
          "2": "الأسبوع الثاني",
          "3": "الأسبوع الثالث",

      function detectWeekLabelFromSources(text, fileName, aiWeekLabel) {
        var combined = [
          String(fileName || extractedFileName || ""),
          String(text || ""),
          String(aiWeekLabel || "")
        ].join(" ");

        // Explicit SEM1..SEM5 detection (with SEM4 -> الأسبوع الرابع)
        var semMatch = combined.match(/(?:^|[^a-zA-Z0-9])SEM\s*([1-5١-٥])(?=$|[^a-zA-Z0-9])/i);
        if (semMatch && semMatch[1]) {
          var semDigit = toLatinDigit(semMatch[1]);
          var mappedSem = mapWeekNumberToArabicLabel(semDigit);
          if (mappedSem) return mappedSem;
        }

        // Arabic ordinal or digit week patterns
        var weekOrdMatch = combined.match(
          /(?:الأسبوع|الاسبوع)\s*(الأول|الاول|الثاني|الثالث|الرابع|الخامس)/i
        );
        if (weekOrdMatch && weekOrdMatch[1]) {
          var ordNorm = weekOrdMatch[1].replace(/^الاول$/, "الأول");
          return "الأسبوع " + ordNorm;
        }

        var weekNumMatch = combined.match(/(?:الأسبوع|الاسبوع)\s*([1-5١-٥])/i);
        if (weekNumMatch && weekNumMatch[1]) {
          var numMapped = mapWeekNumberToArabicLabel(toLatinDigit(weekNumMatch[1]));
          if (numMapped) return numMapped;
        }

        return "الأسبوع";
      }

      function normalizeSessionDigit(raw) {

          "1": "1", "١": "1", "s1": "1",

          "premiere": "1", "première": "1", "premier": "1", "1ere": "1", "1ère": "1", "1re": "1", "1e": "1",
          "2": "2", "٢": "2", "s2": "2",
          "الثانية": "2", "الثاني": "2",
          "deuxieme": "2", "deuxième": "2", "deux": "2", "2eme": "2", "2ème": "2", "2e": "2",

      function extractSlideOrPageSlice(text, targetNum) {
        var src = String(text || "");
        var numPattern = String(targetNum).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        var reStart = new RegExp(
          "(?:\\[\\s*(?:شريحة|صفحة)\\s*" + numPattern + "\\s*[:\\]|]|(?:^|\\n)\\s*(?:شريحة|صفحة)\\s*" + numPattern + "\\s*[:\\-–—])",
          "i"
        );
        var matchStart = src.match(reStart);
        if (!matchStart || matchStart.index === undefined) return "";

        var startPos = matchStart.index + matchStart[0].length;
        var rest = src.slice(startPos);
        var matchNext = rest.match(
          /(?:\[\s*(?:شريحة|صفحة)\s*\d+\s*[:\]|]|(?:\n|^)\s*(?:شريحة|صفحة)\s*\d+\s*[:\-–—])/i
        );
        var endPos = matchNext && matchNext.index !== undefined ? matchNext.index : Math.min(rest.length, 2600);
        return rest.slice(0, endPos).trim();
      }

      function extractPage5Block(text) {

        ) {

        var slideMatches = src.split(/(?=\[\s*(?:شريحة|صفحة)\s*\d+\s*[:\]|]|(?:\n|^)\s*(?:شريحة|صفحة)\s*\d+\s*[:\-–—])/i);
        for (var i = 0; i < slideMatches.length; i++) {
          var part = slideMatches[i];
          if (/برمجة\s*(?:الأسبوع|الاسبوع)|organisation\s+de\s+la\s+semaine/i.test(part)) {
            return part
              .replace(/^(?:\[\s*(?:شريحة|صفحة)\s*\d+\s*[:\]|]|(?:شريحة|صفحة)\s*\d+\s*[:\-–—])\s*/i, "")
              .trim();
          }
        }

        var block5 = extractSlideOrPageSlice(src, 5);
        if (block5) return block5;

        var idxProg = src.search(/برمجة\s*(?:الأسبوع|الاسبوع)|organisation\s+de\s+la\s+semaine/i);
        if (idxProg !== -1) return src.slice(idxProg, idxProg + 2600);

      function sanitizeAnnouncementTitle(rawTitle, levelNum) {

      function parsePage5Sessions(page5Text) {
        var result = {
          "1": { l1: "......", l2: "......" },
          "2": { l1: "......", l2: "......" },
          "3": { l1: "......", l2: "......" },
          "4": { l1: "......", l2: "......" },
          "5": { l1: "......", l2: "......" }
        };
        if (!page5Text) return result;

        var rawLines = page5Text
          .split(/\r?\n|\s*\|\s*/)
          .map(function (l) {
            return l.trim();
          })
          .filter(function (l) {
            return (
              l &&
              !/^برمجة\s*(?:الأسبوع|الاسبوع)\s*$/i.test(l) &&
              !/^برمجة\s*(?:الأسبوع|الاسبوع)\s*[:\-–—]?\s*(?:\d+|[١-٥]|الأول|الثاني|الثالث|الرابع|الخامس)\s*$/i.test(l) &&
              !/^(?:\[\s*(?:شريحة|صفحة)\s*\d+\s*[:\]|]|(?:شريحة|صفحة)\s*\d+\s*[:\-–—])/i.test(l)
            );
          });

        var currentS = null;
        var buckets = { "1": [], "2": [], "3": [], "4": [], "5": [] };

        for (var i = 0; i < rawLines.length; i++) {
          var line = rawLines[i];
          var headMatch = line.match(
            /^(?:S\s*([1-5١-٥])|الحصة\s*(?:رقم\s*)?([1-5١-٥]|الأولى|الاولى|الثانية|الثالثة|الرابعة|الخامسة|الأول|الاول|الثاني|الثالث|الرابع|الخامس)|s[ée]ance\s*(?:n[°o]?\s*)?([1-5١-٥]|premi[eè]re|deuxi[eè]me|troisi[eè]me|quatri[eè]me|cinqui[eè]me|1re|1e|2e|3e|4e|5e)|([1-5١-٥]))\s*[\-\–—:.)/]\s*(.*)$/i

        var orderedKeys = ["1", "2", "3", "4", "5"].sort(function (a, b) {
          return parseInt(a, 10) - parseInt(b, 10);

        for (var k = 0; k < orderedKeys.length; k++) {
          var keyStr = orderedKeys[k];
          var b = buckets[keyStr];
          if (b && b.length > 0) {
            result[keyStr].l1 = b[0] || "......";
            result[keyStr].l2 = b[1] || b[0] || "......";
          }
        }

        return result;
      }

      function detectSessionNumber(text, fileName) {
        var titleSrc = String(fileName || extractedFileName || "");

        var titleMatch = titleSrc.match(sessionRe);
        if (titleMatch) {
          var tNorm = normalizeSessionDigit(titleMatch[1] || titleMatch[2] || titleMatch[3]);
          if (tNorm) return tNorm;
        }

        var slide1Block = extractSlideOrPageSlice(fullSrc, 1);
        var headerBlock = slide1Block || fullSrc.slice(0, 700);
        var hdrMatch = headerBlock.match(sessionRe);
        if (hdrMatch) {
          var hNorm = normalizeSessionDigit(hdrMatch[1] || hdrMatch[2] || hdrMatch[3]);

      function extractLevelsFromTitleSource(sourceText) {
        var src = String(sourceText || "");
        if (!src) return null;

        var pairPatterns = [
          /([1-6١-٦])\s*(?:و|أو|او|&|\/|-|–)\s*([1-6١-٦])\s*(?:المستويان|المستويين|مستويان|مستويين)/i,
          /(?:المستويان|المستويين|مستويان|مستويين)\s*([1-6١-٦])\s*(?:و|أو|او|&|\/|-|–)\s*([1-6١-٦])/i,
          /(?:niveaux?|niv\.?)\s*([1-6١-٦])\s*(?:et|&|\/|-)\s*([1-6١-٦])/i,
          /(?:^|[^a-zA-Z0-9])([1-6١-٦])\s*(?:AP|AEP)\s*(?:et|&|\/|-)\s*([1-6١-٦])\s*(?:AP|AEP)?(?=$|[^a-zA-Z0-9])/i,
          /(?:^|[^0-9١-٦])([1-6١-٦])\s*(?:&|\/|-)\s*([1-6١-٦])(?=$|[^0-9١-٦])/i
        ];

        for (var p = 0; p < pairPatterns.length; p++) {
          var pm = src.match(pairPatterns[p]);
          if (pm && pm[1] && pm[2]) {

            var d2 = toLatinDigit(pm[2]);
            if (/^[1-6]$/.test(d1) && /^[1-6]$/.test(d2) && d1 !== d2) {
              return [d1, d2].sort(function (a, b) {
                return parseInt(a, 10) - parseInt(b, 10);
              });
            }
          }
        }

        var found = [];
        var singlePatterns = [
          /(?:المستوى|المستوي)\s*(?:الأول|الاول|الثاني|الثالث|الرابع|الخامس|السادس|[1-6١-٦])/gi,
          /(?:niveau|niv\.?)\s*([1-6١-٦])/gi,
          /(?:^|[^a-zA-Z0-9])([1-6١-٦])\s*(?:AP|AEP)(?=$|[^a-zA-Z0-9])/gi,
          /(?:^|[^a-zA-Z0-9])N([1-6١-٦])(?=$|[^a-zA-Z0-9])/gi
        ];

        for (var s = 0; s < singlePatterns.length; s++) {
          var re = singlePatterns[s];
          var m;
          while ((m = re.exec(src)) !== null) {
            var token = m[1]
              ? m[1]
              : m[0].replace(/^(?:المستوى|المستوي)\s*/i, "").trim();
            var norm = normalizeSessionDigit(token) || toLatinDigit(token);
            if (/^[1-6]$/.test(norm) && found.indexOf(norm) === -1) {
              found.push(norm);
            }
          }
        }

        if (found.length >= 2) {
          found.sort(function (a, b) {
            return parseInt(a, 10) - parseInt(b, 10);
          });
          return [found[0], found[1]];
        }

        return null;
      }

      function detectTwoLevels(text, fileName) {
        var nameArg = typeof fileName === "string" ? fileName : extractedFileName;
        var src = String(text || "");

        var fromFileName = extractLevelsFromTitleSource(nameArg);
        if (fromFileName) {
          return {
            firstNum: fromFileName[0],
            secondNum: fromFileName[1],
            pairLabel: "المستويان " + fromFileName[0] + " و " + fromFileName[1]
          };
        }

        var slide1Block = extractSlideOrPageSlice(src, 1);
        var titleHeader = slide1Block || src.slice(0, 700);
        var fromTitleSlide = extractLevelsFromTitleSource(titleHeader);
        if (fromTitleSlide) {
          return {
            firstNum: fromTitleSlide[0],
            secondNum: fromTitleSlide[1],
            pairLabel: "المستويان " + fromTitleSlide[0] + " و " + fromTitleSlide[1]
          };
        }

        var p5Block = extractPage5Block(src);
        var fromP5 = extractLevelsFromTitleSource(p5Block);
        if (fromP5) {
          return {
            firstNum: fromP5[0],
            secondNum: fromP5[1],
            pairLabel: "المستويان " + fromP5[0] + " و " + fromP5[1]
          };
        }

        var fromFull = extractLevelsFromTitleSource(src);
        if (fromFull) {
          return {
            firstNum: fromFull[0],
            secondNum: fromFull[1],
            pairLabel: "المستويان " + fromFull[0] + " و " + fromFull[1]
          };
        }

        return {
          firstNum: "5",
          secondNum: "6",
          pairLabel: "المستويان 5 و 6"
        };
      }

      function handleFileSelected(inputEl) {
        var file = null;
        try {
          file = inputEl && inputEl.files && inputEl.files[0] ? inputEl.files[0] : null;
        } catch (e) {
          file = null;
        }
        if (!file) {
          setUploadStatus("");
          return;
        }

        lastAiResponseObj = null;
        extractedFileName = file.name || "lesson";
        detectedLevels = detectTwoLevels("", extractedFileName);
        activeSessionNum = detectSessionNumber("", extractedFileName);
        setUploadStatus("جاري التحميل...");

        var settled = false;
        function finalizeRead(rawText) {
          if (settled) return;
          settled = true;
          clearTimeout(safetyTimer);
          var trimmed = String(rawText || "").trim();
          extractedLessonContent = trimmed || buildFilenameFallbackText(extractedFileName);
          detectedLevels = detectTwoLevels(extractedLessonContent, extractedFileName);
          activeSessionNum = detectSessionNumber(extractedLessonContent, extractedFileName);
          setUploadStatus("تم تحميل الملف: " + extractedFileName);
        }

        var safetyTimer = setTimeout(function () {
          finalizeRead(extractedLessonContent || buildFilenameFallbackText(extractedFileName));
        }, 12000);

        var lower = extractedFileName.toLowerCase();
        var prom;
        try {
          if (lower.endsWith(".pdf")) {
            prom = readPdfFile(file);
          } else if (lower.endsWith(".pptx")) {
            prom = readPptxFile(file);
          } else {
            prom = readFileAsTextSafe(file);
          }
        } catch (e) {
          finalizeRead(buildFilenameFallbackText(extractedFileName));
          return;
        }

        Promise.resolve(prom)
          .then(function (txt) {
            finalizeRead(txt);
          })
          .catch(function () {
            finalizeRead(buildFilenameFallbackText(extractedFileName));
          });
      }

      function buildLocalMindmap(text, sessionNum) {
        var clean = String(text || "").replace(/\s+/g, " ").trim();
        var lvls = detectTwoLevels(text, extractedFileName);
        var p5Block = extractPage5Block(text);
        var p5Sessions = parsePage5Sessions(p5Block);

        var lines = clean
          .split(/[\n\r.!؟]+/)
          .map(function (s) {
            return s.trim();
          })
          .filter(function (s) {
            return s.length > 3 && !/^\[?(?:شريحة|صفحة)\s*\d+\]?/i.test(s);
          });

        var weekLabel = detectWeekLabelFromSources(text, extractedFileName, "");

        var chosen = p5Sessions[String(sessionNum)] || { l1: "......", l2: "......" };
        var l1Title =
          chosen.l1 !== "......"
            ? chosen.l1
            : lines[0]
            ? lines[0]
            : "موضوع S" + sessionNum;
        var l2Title =
          chosen.l2 !== "......"
            ? chosen.l2
            : lines[1]
            ? lines[1]
            : l1Title;

        var cleanAnnL1 = sanitizeAnnouncementTitle(l1Title, lvls.firstNum) || l1Title;
        var cleanAnnL2 = sanitizeAnnouncementTitle(l2Title, lvls.secondNum) || l2Title;

        var durMatch = clean.match(/(\d+\s*(?:د|دقيقة|min))/i);
        var pageMatch = clean.match(/(?:ص|صفحة|p\.?)\s*(\d+|[٠-٩]+)/i);

        return {
          levels: lvls,
          weekLabel: weekLabel,
          sessionNumber: String(sessionNum),
          currentLessonTitle:
            "S" + sessionNum + " (" + getSessionOrdinalArabic(sessionNum) + ") : " + cleanAnnL1,
          weekSessions: p5Sessions,
          openingDuration: durMatch ? durMatch[1] : ".....",
          mentalMathPage: pageMatch ? toLatinDigit(pageMatch[1]) : "....",
          announcementL1: cleanAnnL1,
          announcementL2: cleanAnnL2,
          goal1: lines[0] || cleanAnnL1,
          goal2: lines[1] || cleanAnnL2,
          mod1: lines[2] || cleanAnnL1,
          mod2: lines[3] || cleanAnnL2,
          guided1Boards: cleanAnnL1,
          guided1Workbook: pageMatch
            ? "الأنشطة التطبيقية : ص " + toLatinDigit(pageMatch[1]) + " (......)"
            : "الأنشطة : ص ...... (......)",
          guided2Boards: cleanAnnL2,
          guided2Workbook: pageMatch
            ? "الأنشطة التطبيقية : ص " + toLatinDigit(pageMatch[1]) + " (......)"
            : "الأنشطة : ص ...... (......)",
          indep1: lines[4] || cleanAnnL1,
          indep2: lines[5] || cleanAnnL2,

        };
      }

      function callFlash3ModelWithKey(apiKey, userPromptText, idx, lastErr) {
        if (idx >= GEMINI_FLASH_3_MODELS.length) {
          return Promise.reject(new Error(lastErr || "ERROR"));
        }
        var modelName = GEMINI_FLASH_3_MODELS[idx];
        var url =
          "https://generativelanguage.googleapis.com/v1beta/models/" +
          encodeURIComponent(modelName) +
          ":generateContent?key=" +
          encodeURIComponent(apiKey);

        var bodyPayload = {
          systemInstruction: { parts: [{ text: HIDDEN_SYSTEM_INSTRUCTION }] },
          contents: [{ role: "user", parts: [{ text: userPromptText }] }],
          generationConfig: {
            temperature: 0.2,
            responseMimeType: "application/json"
          }
        };

        return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyPayload)
        })
          .then(function (res) {
            return res.json().then(function (data) {
              if (!res.ok) {
                throw new Error(
                  (data && data.error && data.error.message) || "HTTP " + res.status
                );
              }
              return data;
            });
          })
          .then(function (data) {
            var raw = "";
            try {
              raw = data.candidates[0].content.parts[0].text || "";
            } catch (e) {
              throw new Error("EMPTY");
            }
            var cleanJson = raw
              .replace(/^```json\s*/i, "")
              .replace(/```\s*$/i, "")
              .trim();
            return JSON.parse(cleanJson);
          })
          .catch(function (err) {
            return callFlash3ModelWithKey(
              apiKey,
              userPromptText,
              idx + 1,
              (err && err.message) || "ERR"
            );
          });
      }

      function normalizeModelOutput(aiObj, sessionNum, preserveRequestedSession) {
        var base = buildLocalMindmap(extractedLessonContent, sessionNum);
        if (!aiObj || typeof aiObj !== "object") return base;

        var sNum = preserveRequestedSession
          ? String(sessionNum)
          : normalizeSessionDigit(aiObj.session_number) || String(sessionNum);
        var lvls = detectTwoLevels(
          (extractedLessonContent || "") + " " + (aiObj.levels_label || ""),
          extractedFileName
        );

        var resolvedWeekLabel = detectWeekLabelFromSources(
          extractedLessonContent,
          extractedFileName,
          aiObj.week_label
        );
        if (resolvedWeekLabel === "الأسبوع" && aiObj.week_label && String(aiObj.week_label).trim()) {
          resolvedWeekLabel = String(aiObj.week_label).trim();
        }

        var mergedWeek = {
          "1": { l1: base.weekSessions["1"].l1, l2: base.weekSessions["1"].l2 },
          "2": { l1: base.weekSessions["2"].l1, l2: base.weekSessions["2"].l2 },
          "3": { l1: base.weekSessions["3"].l1, l2: base.weekSessions["3"].l2 },
          "4": { l1: base.weekSessions["4"].l1, l2: base.weekSessions["4"].l2 },
          "5": { l1: base.weekSessions["5"].l1, l2: base.weekSessions["5"].l2 }
        };

        if (aiObj.week_sessions && typeof aiObj.week_sessions === "object") {
          for (var k = 1; k <= 5; k++) {
            var val = aiObj.week_sessions[String(k)];
            if (typeof val === "string" && val.trim()) {
              var parts = val
                .split(/\s*\|\s*|\n/)
                .map(function (p) {
                  return cleanPage5LessonLine(p);
                })
                .filter(Boolean);
              if (parts[0]) {
                mergedWeek[String(k)].l1 = parts[0];
              }
              if (parts[1]) {
                mergedWeek[String(k)].l2 = parts[1];
              }
            } else if (val && typeof val === "object") {
              var v1 = cleanPage5LessonLine(val.l1 || "");
              var v2 = cleanPage5LessonLine(val.l2 || "");
              if (v1) {
                mergedWeek[String(k)].l1 = v1;
              }
              if (v2) {
                mergedWeek[String(k)].l2 = v2;
              }
            }
          }
        }

        var sessionRow = mergedWeek[String(sNum)] || { l1: "......", l2: "......" };
        var annStr = String(aiObj.today_announcement || "").trim();
        var annParts = annStr.split(/\s*\|\s*/);

        var rawAnn1 = preserveRequestedSession
          ? (sessionRow.l1 !== "......" ? sessionRow.l1 : base.announcementL1)
          : (annParts[0] || (sessionRow.l1 !== "......" ? sessionRow.l1 : base.announcementL1));
        var rawAnn2 = preserveRequestedSession
          ? (sessionRow.l2 !== "......" ? sessionRow.l2 : base.announcementL2)
          : (annParts[1] || (sessionRow.l2 !== "......" ? sessionRow.l2 : annParts[0] || base.announcementL2));

        var l1Ann = sanitizeAnnouncementTitle(rawAnn1, lvls.firstNum) || base.announcementL1;
        var l2Ann = sanitizeAnnouncementTitle(rawAnn2, lvls.secondNum) || base.announcementL2;

        var m5 = aiObj.modeling_level_5 || {};
        var m6 = aiObj.modeling_level_6 || {};
        var mod5Combined = [m5.question, m5.steps, m5.tool]
          .map(function (x) {
            return String(x || "").trim();
          })
          .filter(Boolean)
          .join(" | ");
        var mod6Combined = [m6.question, m6.steps, m6.tool]
          .map(function (x) {
            return String(x || "").trim();
          })
          .filter(Boolean)
          .join(" | ");

        var customCurrentTitle =
          !preserveRequestedSession && aiObj.current_lesson_title
            ? String(aiObj.current_lesson_title).trim()
            : "S" + sNum + " (" + getSessionOrdinalArabic(sNum) + ") : " + l1Ann;

        return {
          levels: lvls,
          weekLabel: resolvedWeekLabel || base.weekLabel,
          sessionNumber: sNum,
          currentLessonTitle: customCurrentTitle,
          weekSessions: mergedWeek,
          openingDuration: aiObj.opening_duration
            ? String(aiObj.opening_duration).trim()
            : base.openingDuration,
          mentalMathPage: aiObj.mental_math_page
            ? String(aiObj.mental_math_page).trim()
            : base.mentalMathPage,
          announcementL1: l1Ann,
          announcementL2: l2Ann,
          goal1: aiObj.goal_level_5 ? String(aiObj.goal_level_5).trim() : base.goal1,
          goal2: aiObj.goal_level_6 ? String(aiObj.goal_level_6).trim() : base.goal2,
          mod1: mod5Combined || base.mod1,
          mod2: mod6Combined || base.mod2,
          guided1Boards: aiObj.guided_level_5_boards
            ? String(aiObj.guided_level_5_boards).trim()
            : base.guided1Boards,
          guided1Workbook: aiObj.guided_level_5_workbook
            ? String(aiObj.guided_level_5_workbook).trim()
            : base.guided1Workbook,
          guided2Boards: aiObj.guided_level_6_boards
            ? String(aiObj.guided_level_6_boards).trim()
            : base.guided2Boards,
          guided2Workbook: aiObj.guided_level_6_workbook
            ? String(aiObj.guided_level_6_workbook).trim()
            : base.guided2Workbook,
          indep1: aiObj.independent_level_5
            ? String(aiObj.independent_level_5).trim()
            : base.indep1,
          indep2: aiObj.independent_level_6

            : base.indep2,
          bilingualTerms: aiObj.bilingual_terms
            ? String(aiObj.bilingual_terms).trim()
            : base.bilingualTerms
        };
      }

        var offset = Number(cardHeightOffsets[cardKey] || 0);

        var baseMin = Math.max(85, 130 + offset);
        if (offset > 0) {
          return ' style="min-height:' + baseMin + 'px;flex-grow:' + (1 + offset / 90).toFixed(2) + ';"';

      function applyCardHeightOffset(cardKey, delta) {
        if (!cardKey || !Object.prototype.hasOwnProperty.call(cardHeightOffsets, cardKey)) {
          return;
        }
        var current = Number(cardHeightOffsets[cardKey] || 0);
        var next = Math.max(-90, Math.min(240, current + Number(delta || 0)));
        cardHeightOffsets[cardKey] = next;

        var cardEl = document.querySelector('#mindmapPage .card[data-card-key="' + cardKey + '"]');
        if (cardEl) {
          var baseMin = Math.max(85, 130 + next);
          cardEl.style.minHeight = baseMin + "px";
          cardEl.style.flexGrow = next > 0 ? (1 + next / 90).toFixed(2) : next < 0 ? "0.65" : "1";
        }
        computeAndApplySinglePagePrintScale();
      }

      function computeAndApplySinglePagePrintScale() {
        var pageEl = document.getElementById("mindmapPage");
        if (!pageEl) return;
        // Landscape A4 printable height at 96dpi is ~740px; scale down smoothly if tall
        var rect = pageEl.getBoundingClientRect();
        var naturalHeight = pageEl.scrollHeight || rect.height || 780;
        var targetHeight = 735;
        var scale = naturalHeight > targetHeight ? Math.max(0.62, Math.min(1, targetHeight / naturalHeight)) : 0.96;
        pageEl.style.setProperty("--print-scale", scale.toFixed(3));
      }

      function renderResultSheet(data) {
        var container = document.getElementById("resultContainer");
        if (!container) return;
        var safeMathData = data && data.levels ? data : buildLocalMindmap("", "1");
        container.innerHTML = renderMathSheet(safeMathData);
        computeAndApplySinglePagePrintScale();

      function openInstantSem4Preview() {
        extractedFileName = "Maths_5_6_SEM4_S1.pptx";
        extractedLessonContent = SAMPLE_SEM4_CONTENT;
        lastAiResponseObj = null;
        detectedLevels = detectTwoLevels(extractedLessonContent, extractedFileName);
        activeSessionNum = "1";
        var sampleData = buildLocalMindmap(extractedLessonContent, activeSessionNum);
        renderResultSheet(sampleData);
        showView("resultView");
        setResultStatus("");
      }

      function generateMathMindmap() {
        detectedLevels = detectTwoLevels(extractedLessonContent, extractedFileName);
        activeSessionNum = detectSessionNumber(extractedLessonContent, extractedFileName);
        setUploadStatus("جاري التحميل...");

        var buttons = document.querySelectorAll("[data-generate-subject]");
        for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;

        getSharedApiKeySilently()
          .then(function (apiKey) {
            if (!extractedLessonContent) {
              lastAiResponseObj = null;
              var emptyData = buildLocalMindmap("", activeSessionNum);
              renderResultSheet(emptyData);
              showView("resultView");
              setResultStatus("");
              return null;
            }
            if (!apiKey) {
              lastAiResponseObj = null;
              var localData = buildLocalMindmap(extractedLessonContent, activeSessionNum);
              renderResultSheet(localData);
              showView("resultView");
              setResultStatus("");
              return null;
            }

            var promptText =
              "اسم الملف / العنوان: " +
              extractedFileName +
              "\nالمستويان المؤكدان من العنوان: " +
              detectedLevels.pairLabel +
              " (المستوى " +
              detectedLevels.firstNum +
              " والمستوى " +
              detectedLevels.secondNum +
              ")" +
              "\nالمادة: math" +
              "\nالحصة المكتشفة: S" +
              activeSessionNum +
              " (" +
              getSessionOrdinalArabic(activeSessionNum) +
              ")" +
              "\nنص الدرس:\n" +
              extractedLessonContent;

            return callFlash3ModelWithKey(apiKey, promptText, 0, "").then(function (aiObj) {
              lastAiResponseObj = aiObj;
              var normalized = normalizeModelOutput(aiObj, activeSessionNum, false);
              activeSessionNum = normalized.sessionNumber;
              renderResultSheet(normalized);
              showView("resultView");
              setResultStatus("");
            });
          })
          .catch(function () {
            lastAiResponseObj = null;
            var fallbackData = buildLocalMindmap(extractedLessonContent, activeSessionNum);
            renderResultSheet(fallbackData);
            showView("resultView");
            setResultStatus("");
          })
          .finally(function () {
            setUploadStatus("");
            for (var j = 0; j < buttons.length; j++) buttons[j].disabled = false;
          });
      }

      function bindDropZones() {
        var zones = document.querySelectorAll("[data-drop-zone]");
        var inp = document.getElementById("fileInputMath");
        if (!inp) return;

        for (var i = 0; i < zones.length; i++) {
          (function (zone) {
            ["dragenter", "dragover"].forEach(function (evtName) {
              zone.addEventListener(evtName, function (ev) {
                ev.preventDefault();
                zone.classList.add("drag-over");
              });
            });

            ["dragleave", "drop"].forEach(function (evtName) {
              zone.addEventListener(evtName, function (ev) {
                ev.preventDefault();
                zone.classList.remove("drag-over");
              });
            });

            zone.addEventListener("drop", function (ev) {
              var dt = ev.dataTransfer;
              if (dt && dt.files && dt.files.length > 0) {
                try {
                  inp.files = dt.files;
                } catch (e) {}
                handleFileSelected({ files: [dt.files[0]] });
              }
            });
          })(zones[i]);
        }
      }

      function bindEvents() {
        var backUploadBtn = document.getElementById("resultBackUploadBtn");
        var downloadBtn = document.getElementById("downloadMindmapBtn");
        var printBtn = document.getElementById("printMindmapBtn");
        var fileMath = document.getElementById("fileInputMath");

        if (fileMath) {
          fileMath.addEventListener("change", function () {
            handleFileSelected(fileMath);
          });
        }

        bindDropZones();

        if (backUploadBtn) {
          backUploadBtn.addEventListener("click", function () {
            showView("uploadMathView");
          });
        }

        if (printBtn) {
          printBtn.addEventListener("click", function () {
            computeAndApplySinglePagePrintScale();
            window.print();
          });
        }

        window.addEventListener("beforeprint", computeAndApplySinglePagePrintScale);

        if (downloadBtn) {
          downloadBtn.addEventListener("click", downloadResultMindmap);
        }

        document.addEventListener("click", function (ev) {
          var target = ev.target;
          if (!target || !target.closest) return;

          var resizeBtn = target.closest("[data-resize-card]");
          if (resizeBtn) {
            ev.preventDefault();
            ev.stopPropagation();
            var cKey = resizeBtn.getAttribute("data-resize-card");
            var delta = parseInt(resizeBtn.getAttribute("data-resize-delta") || "0", 10);
            applyCardHeightOffset(cKey, delta);
            return;
          }

          if (target.closest('[data-action="go-index"]')) {
            goBackToIndex();
            return;
          }

          var genEl = target.closest("[data-generate-subject]");
          if (genEl) {
            generateMathMindmap();
            return;
          }

          var chipEl = target.closest("[data-select-session]");
          if (chipEl) {
            var picked = chipEl.getAttribute("data-select-session");
            if (picked && picked !== activeSessionNum) {
              activeSessionNum = picked;
              var updated = lastAiResponseObj
                ? normalizeModelOutput(lastAiResponseObj, activeSessionNum, true)
                : buildLocalMindmap(extractedLessonContent, activeSessionNum);
              renderResultSheet(updated);
              setResultStatus("");
            }
          }
        });
      }

      function initApp() {
        initFirebase();
        updateAccountBadgeFromStorage();
        showView("uploadMathView");
        getSharedApiKeySilently();
        bindEvents();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
